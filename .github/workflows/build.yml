name: NyxBox Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;29.0.13846066" \
            "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x NyxBox/gradlew

      - name: Fix local.properties for CI
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk}
          echo "sdk.dir=$ANDROID_HOME" > NyxBox/local.properties

      - name: Build NyxBox Bcore AAR (release)
        working-directory: NyxBox
        run: ./gradlew --no-daemon :core:assembleRelease

      - name: Build NyxBox Loader APK (debug)
        working-directory: NyxBox
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload SDK AAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyxbox-core-aar
          path: NyxBox/core/build/outputs/aar/*.aar

      - name: Upload Loader APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyxbox-loader-debug-apk
          path: NyxBox/app/build/outputs/apk/debug/*.apk
